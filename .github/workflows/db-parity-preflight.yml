name: OresDB five-backend coordinator tests (host-only)
on:
  pull_request:
    paths:
      - 'ci/verify-native-wal.sh'
      - 'ci/verify-five-backend-wal-parity.sh'
      - 'ci/test-five-backend-preflight.sh'
      - 'tests/guest/**'
      - 'src/wal/frame.ores'
      - 'ci/test-wal-nonfloating-byte-pack.sh'
      - 'ci/verify-native-wal-negative-challenge.sh'
      - 'ci/test-native-wal-negative-challenge.sh'
      - 'ci/assert-native-wal-receipts.sh'
      - 'ci/test-native-wal-receipts.sh'
      - '.github/workflows/db-parity-preflight.yml'
permissions:
  contents: read
jobs:
  offline-preflight-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Exact PR head and clean checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "DB_COORDINATOR_SOURCE_HEAD=$EXPECTED_HEAD"
          echo "DB_COORDINATOR_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: POSIX syntax, 16-case receipt forgery, and five-backend host contracts
        shell: bash
        run: |
          set -euo pipefail
          sh -n ci/verify-native-wal.sh
          sh -n ci/verify-native-wal-negative-challenge.sh
          sh -n ci/test-native-wal-negative-challenge.sh
          sh -n ci/assert-native-wal-receipts.sh
          sh -n ci/test-native-wal-receipts.sh
          sh -n ci/verify-five-backend-wal-parity.sh
          sh -n ci/test-five-backend-preflight.sh
          sh ci/test-five-backend-preflight.sh
          sh ci/test-wal-nonfloating-byte-pack.sh
          sh ci/test-native-wal-negative-challenge.sh
          sh ci/test-native-wal-receipts.sh
      - name: Evidence boundary
        run: echo 'This workflow tests scripts using mocks; it does not compile or run .ores, exercise a database, or attest backend parity.'
