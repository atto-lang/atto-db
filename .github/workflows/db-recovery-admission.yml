name: DB stage16 verified WAL recovery admission (host only)
on:
  pull_request:
    paths:
      - '.github/workflows/db-recovery-admission.yml'
      - 'runtime/java/src/org/oreslang/db/primitive/ReadOnlyWalReplay.java'
      - 'runtime/java/src/org/oreslang/db/primitive/ReadOnlyShardRecovery.java'
      - 'runtime/java/src/org/oreslang/db/primitive/DbShardRecoveryAdmission.java'
      - 'runtime/java/test/org/oreslang/db/primitive/ReadOnlyShardRecoveryTest.java'
      - 'runtime/java/test/org/oreslang/db/primitive/DbShardRecoveryAdmissionTest.java'
  push:
    branches:
      - 'feat/native-db-verified-recovery-admission-stage16-20261031'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-admission-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact head and five production and test Java blobs
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          declare -A sha=(
            [runtime/java/src/org/oreslang/db/primitive/ReadOnlyWalReplay.java]='8da48ec37b5a2ab8cb141c2403669fce6ffb6024'
            [runtime/java/src/org/oreslang/db/primitive/ReadOnlyShardRecovery.java]='5208e8503587eb69aeb908a62bfd223b32961583'
            [runtime/java/src/org/oreslang/db/primitive/DbShardRecoveryAdmission.java]='633ae45460f31f1a7285eac8c0cd1e8053756a35'
            [runtime/java/test/org/oreslang/db/primitive/ReadOnlyShardRecoveryTest.java]='9e7f0109fd94dc1a80d4a81689aa7e070b659193'
            [runtime/java/test/org/oreslang/db/primitive/DbShardRecoveryAdmissionTest.java]='4109c3aff5420e3bc4bd6bdc1dac5c914792e782'
          )
          for file in "${!sha[@]}"; do
            test "$(git hash-object "$file")" = "${sha[$file]}"
          done
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test actual read-only recovery and admission sources
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          sha256sum "$(readlink -f "$(command -v java)")" "$(readlink -f "$(command -v javac)")"
          mkdir -p "$RUNNER_TEMP/db-stage16"
          javac -Xlint:all -Werror -d "$RUNNER_TEMP/db-stage16" \
            runtime/java/src/org/oreslang/db/primitive/ReadOnlyWalReplay.java \
            runtime/java/src/org/oreslang/db/primitive/ReadOnlyShardRecovery.java \
            runtime/java/src/org/oreslang/db/primitive/DbShardRecoveryAdmission.java \
            runtime/java/test/org/oreslang/db/primitive/ReadOnlyShardRecoveryTest.java \
            runtime/java/test/org/oreslang/db/primitive/DbShardRecoveryAdmissionTest.java
          printf '%s\n' 'HOST_SHARD_RECOVERY_ADMISSION_PASS checks=48 (read-only runtime-gated candidate; NO writer or guest ACK)' > "$RUNNER_TEMP/expected-admission.txt"
          printf '%s\n' 'HOST_READ_ONLY_SHARD_RECOVERY_PASS checks=44 (full WAL candidate only; NOT durable ACK or resumed writer)' > "$RUNNER_TEMP/expected-recovery.txt"
          for round in 1 2 3 4 5; do
            timeout 50s java -cp "$RUNNER_TEMP/db-stage16" \
              org.oreslang.db.primitive.DbShardRecoveryAdmissionTest > "$RUNNER_TEMP/actual-admission.txt"
            cmp "$RUNNER_TEMP/expected-admission.txt" "$RUNNER_TEMP/actual-admission.txt"
            timeout 50s java -cp "$RUNNER_TEMP/db-stage16" \
              org.oreslang.db.primitive.ReadOnlyShardRecoveryTest > "$RUNNER_TEMP/actual-recovery.txt"
            cmp "$RUNNER_TEMP/expected-recovery.txt" "$RUNNER_TEMP/actual-recovery.txt"
            cat "$RUNNER_TEMP/actual-admission.txt" "$RUNNER_TEMP/actual-recovery.txt"
          done
