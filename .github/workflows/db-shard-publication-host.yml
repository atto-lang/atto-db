name: DB host shard WAL-before-publication (NOT native guest)
on:
  pull_request:
    paths:
      - '.github/workflows/db-shard-publication-host.yml'
      - 'runtime/java/src/org/oreslang/db/primitive/WalFilePrimitive.java'
      - 'runtime/java/src/org/oreslang/db/primitive/WalRuntimeGrant.java'
      - 'runtime/java/src/org/oreslang/db/primitive/ShardPublicationGate.java'
      - 'runtime/java/test/org/oreslang/db/primitive/ShardPublicationGateTest.java'
permissions:
  contents: read
jobs:
  shard-publication-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Confirm exact head and four trusted Java source blobs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git hash-object runtime/java/src/org/oreslang/db/primitive/WalFilePrimitive.java)" = '044af806aefbffeb6ad440d403a10aa6b0e569aa'
          test "$(git hash-object runtime/java/src/org/oreslang/db/primitive/WalRuntimeGrant.java)" = 'f3b33fe8853d0978c10c010f45976bdd6314d958'
          test "$(git hash-object runtime/java/src/org/oreslang/db/primitive/ShardPublicationGate.java)" = '475e7fd4d4d9294a715df6c08b5e59ee5d98c37b'
          test "$(git hash-object runtime/java/test/org/oreslang/db/primitive/ShardPublicationGateTest.java)" = '0665b63d0a042e46de1bce4d2630053b819f0ed5'
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile actual WAL runtime grant and execute shard gate
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          sha256sum "$(readlink -f "$(command -v java)")" "$(readlink -f "$(command -v javac)")"
          mkdir -p "$RUNNER_TEMP/shard-host"
          javac -Xlint:all -Werror -d "$RUNNER_TEMP/shard-host" \
            runtime/java/src/org/oreslang/db/primitive/WalFilePrimitive.java \
            runtime/java/src/org/oreslang/db/primitive/WalRuntimeGrant.java \
            runtime/java/src/org/oreslang/db/primitive/ShardPublicationGate.java \
            runtime/java/test/org/oreslang/db/primitive/ShardPublicationGateTest.java
          printf '%s\n' 'HOST_SHARD_PUBLICATION_GATE_PASS checks=37 (local actor-gate harness; NOT guest, runtime-integrated ACK or recovery proof)' > "$RUNNER_TEMP/expected.txt"
          for round in 1 2 3 4 5; do
            timeout 30s java -cp "$RUNNER_TEMP/shard-host" \
              org.oreslang.db.primitive.ShardPublicationGateTest > "$RUNNER_TEMP/actual.txt"
            cmp "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
            cat "$RUNNER_TEMP/actual.txt"
          done
